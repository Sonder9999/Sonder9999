name: Update contributions GIF

# 运行时机
#   1. 每周一 09:17（北京时间）自动运行一次。
#      GitHub 的 cron 使用 UTC：01:17 UTC = 09:17 Asia/Shanghai。
#      想改成每天：cron 改成 "17 1 * * *"；想换时间：改 "17 1" 两个字段。
#   2. 也可以在仓库 Actions 页面点 “Run workflow” 手动运行。
on:
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

# 用仓库自带的 GITHUB_TOKEN 提交更新后的 GIF，不需要额外 PAT / secret。
permissions:
  contents: write

# 防止两次运行同时写文件。
concurrency:
  group: update-contributions
  cancel-in-progress: false

jobs:
  update:
    # 固定 Ubuntu 版本：避免 ubuntu-latest 升级时字体/FreeType 渲染出现细微差异，
    # 导致每周多出一次无意义的 GIF 变更。要升级时改成新版本并手动跑一次即可。
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      # 抓取公开 contributions 页面 -> 渲染两张 GIF -> 更新 README alt 文本。
      # 不需要 token；数据抓取失败或总数校验不通过时脚本会直接报错退出，不会提交坏图。
      - name: Regenerate contribution GIFs
        run: python scripts/update_contributions.py

      - name: Commit and push when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-anim.gif assets/contrib-night-anim.gif assets/contributions.json README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh contribution GIFs ($(date -u +%F))"
            git push
          fi
